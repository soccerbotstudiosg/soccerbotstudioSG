version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Singapore
    open-pull-requests-limit: 5
    groups:
      npm-routine:
        patterns: ["*"]
        update-types: [minor, patch]
        # These tools require coordinated runtime, image or compiler changes.
        exclude-patterns:
          - "@playwright/test"
          - "@types/node"
          - "typescript"
          - "eslint"
          - "miniflare"
          - "wrangler"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Singapore
    open-pull-requests-limit: 5
    groups:
      action-routine:
        patterns: ["*"]
        update-types: [minor, patch]
