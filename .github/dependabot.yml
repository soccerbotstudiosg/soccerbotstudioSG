version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Singapore
    open-pull-requests-limit: 1
    groups:
      npm-routine:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
        # These tools require coordinated runtime, image or compiler changes.
        exclude-patterns:
          - "@playwright/test"
          - "@types/node"
          - "typescript"
          - "eslint"
          - "miniflare"
          - "wrangler"
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
        update-types: [minor, patch]
        # Major and coordinated tooling security fixes remain individual PRs.
        exclude-patterns:
          - "@playwright/test"
          - "@types/node"
          - "typescript"
          - "eslint"
          - "miniflare"
          - "wrangler"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Singapore
    open-pull-requests-limit: 1
    groups:
      action-routine:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
