name: Verify
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  frontend:
    if: github.repository != 'soccerbotstudiosg/soccerbotstudioSG'
    name: verify / frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --ipc=host
    env:
      NEXT_PUBLIC_BASE_PATH: /SoccerBotStudioSG
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: npm ci
      - run: npm run verify
      - name: Upload the verified site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.repository == 'LimYouSheng/SoccerBotStudioSG' && vars.DEPLOYMENT_MODE != 'portable'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: out/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: frontend-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          retention-days: 14
          if-no-files-found: error
  backend:
    if: github.repository != 'soccerbotstudiosg/soccerbotstudioSG'
    name: verify / backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --ipc=host
    env:
      NEXT_PUBLIC_BASE_PATH: ""
      WRANGLER_SEND_METRICS: "false"
      WRANGLER_LOG_PATH: test-results/wrangler-logs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: npm ci
      - run: npm run verify:worker
      - run: npm run test:load:smoke
      - run: npm run verify:browser
      - name: Package and check the exact closed developer release
        env:
          RELEASE_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node scripts/prepare-developer-release.mjs
          node scripts/check-developer-release.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: backend-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          retention-days: 14
          if-no-files-found: error
  live-email:
    if: github.repository != 'soccerbotstudiosg/soccerbotstudioSG'
    name: verify / live-email
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --ipc=host
    env:
      NEXT_PUBLIC_BASE_PATH: ""
      RELEASE_PROFILE: live-email
      NEXT_PUBLIC_BOOKING_MODE: live
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 0x4AAAAAAFSTbdgbJQsvM5vy
      WRANGLER_SEND_METRICS: "false"
      WRANGLER_LOG_PATH: test-results/wrangler-logs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: npm ci
      - run: npm run verify:worker
      - run: npm run test:load:smoke
      - run: npm run verify:browser
      - name: Package and check the exact closed developer release
        env:
          RELEASE_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node scripts/prepare-developer-release.mjs
          node scripts/check-developer-release.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: live-email-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          retention-days: 14
          if-no-files-found: error
  deploy:
    needs: frontend
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.repository == 'LimYouSheng/SoccerBotStudioSG' && vars.DEPLOYMENT_MODE != 'portable'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the verified site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
  cloudflare:
    name: deploy / Cloudflare
    needs: [frontend, backend, live-email]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.repository == 'LimYouSheng/SoccerBotStudioSG' && vars.DEPLOYMENT_MODE != 'portable'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    environment:
      name: cloudflare-developer
      url: https://soccerbot-dev.limyousheng-94.workers.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Download this run's verified live artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --name "live-email-evidence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --dir work/deploy-evidence
      - name: Deploy verified artifact and check the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: "false"
          WRANGLER_LOG_PATH: work/deploy-evidence/wrangler-logs
        run: node scripts/deploy-cloudflare.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: cloudflare-deployment-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/deploy-evidence/deployment.json
          retention-days: 14
          if-no-files-found: warn
