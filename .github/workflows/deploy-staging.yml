name: Deploy staging
on:
  workflow_dispatch:
    inputs:
      revision:
        description: Exact verified 40-character source revision
        required: true
        type: string
      verify_run_id:
        description: Successful Verify deployment target run ID
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: deploy-cloudflare-staging
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && vars.DEPLOYMENT_MODE == 'portable' && vars.STAGING_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_TARGET: staging
      RELEASE_REVISION: ${{ inputs.revision }}
      VERIFY_RUN_ID: ${{ inputs.verify_run_id }}
      WRANGLER_SEND_METRICS: "false"
      WRANGLER_LOG_PATH: work/deploy-evidence/wrangler-logs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Validate final-commit gates and download sealed target artifact
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_RESERVED_REVISION: ${{ vars.STAGING_RESERVED_REVISION }}
        run: node scripts/verified-target-run.mjs
      - name: Deploy exact target artifact
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.STAGING_CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/deploy-cloudflare.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: staging-deployment-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/deploy-evidence/deployment.json
          if-no-files-found: warn
          retention-days: 14
